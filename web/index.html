<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TIJE Live · Semua Rute Transjakarta</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ============== PANEL KIRI / BOTTOM SHEET ============== -->
    <aside id="panel">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-label="Perbesar atau perkecil panel"></button>

      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">TJ</div>
          <div>
            <div class="brand-title">TIJE Live</div>
            <div class="brand-sub">Semua Rute Transjakarta</div>
          </div>
        </div>
        <div class="clock">
          <div id="clock">--:--:--</div>
          <div class="clock-sub">WIB</div>
        </div>
      </header>

      <div class="status-strip">
        <span id="modeBadge" class="badge badge-sched"><i></i>Estimasi jadwal GTFS</span>
        <span id="dayBadge" class="badge badge-plain">Memuat</span>
      </div>

      <!-- ---------- Semua rute Transjakarta ---------- -->
      <div id="viewRoutes" class="view">
        <div id="routesBrowse">
          <div class="finder">
            <label class="finder-input">
              <span class="sr-only">Cari rute atau halte</span>
              <input id="routeQuery" type="search" autocomplete="off" enterkeyhint="search"
                     placeholder="Cari rute atau halte" />
            </label>
            <button type="button" id="btnNearby" class="finder-near">Halte terdekat</button>
          </div>
          <div id="catFilter" class="cat-filter" role="group" aria-label="Filter jenis layanan"></div>
          <label class="run-only"><input type="checkbox" id="chkRunning" /> Hanya yang sedang beroperasi</label>
          <div id="placeResults"></div>
          <div id="routeList" class="route-list"></div>
        </div>
        <div id="routeDetail" class="route-detail" hidden></div>
      </div>

      <footer class="foot">
        Data: <a href="https://gtfs.transjakarta.co.id/" target="_blank" rel="noopener">GTFS resmi Transjakarta</a>
        (CC BY 4.0) · feed <span id="feedDate"></span><br />
        Posisi bus dihitung dari jadwal resmi (frekuensi, waktu antar-halte, dan rute jalan asli), bukan dari GPS bus.
        Peta © OpenStreetMap contributors · Esri.
      </footer>
    </aside>

    <!-- ============== PETA ============== -->
    <main id="mapWrap">
      <div id="map"></div>

      <div class="map-toolbar">
        <button type="button" id="btnFit" title="Tampilkan seluruh rute">⤢ Rute</button>
        <label class="toggle"><input type="checkbox" id="chkNetwork" checked /> Garis semua rute</label>
      </div>

      <div id="routeBusCard" class="bus-card hidden"></div>
      <div id="toast" class="toast hidden" role="status"></div>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="routes-index.js"></script>
  <script src="engine.js"></script>
  <script src="routes.js"></script>
  <script src="app.js"></script>
</body>
</html>
